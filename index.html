<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalshi Market Watch</title><style>body{font:16px system-ui;background:#0c1626;color:#f4f7fb;margin:0;padding:20px}main{max-width:1000px;margin:auto}section{background:#1b2a40;padding:18px;border-radius:14px;margin:15px 0}input{padding:12px;border:0;border-radius:7px;width:90%;max-width:460px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #3d4c61}small{color:#b4c4d5}a{color:#9ad3ff}</style></head><body><main><h1>Kalshi Market Watch</h1><p>Read-only market snapshot. Not live quotes or trading advice.</p><section id="status">Loading snapshot…</section><section><input id="q" placeholder="Search ticker or market title"><p id="count"></p><div style="overflow:auto"><table><thead><tr><th>Market</th><th>YES bid</th><th>YES ask</th><th>NO bid</th><th>NO ask</th></tr></thead><tbody id="rows"></tbody></table></div></section><small>Prices are dollars per contract; snapshots can be stale. BettingPros premium data is not published on this public site.</small></main><script>let markets=[];const el=id=>document.getElementById(id);const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=el('q').value.toLowerCase(),filtered=markets.filter(m=>((m.title||'')+' '+(m.ticker||'')).toLowerCase().includes(q));el('count').textContent=filtered.length+' matches; displaying up to 150';el('rows').innerHTML=filtered.slice(0,150).map(m=>'<tr><td>'+esc(m.title)+'<br><small>'+esc(m.ticker)+'</small></td>'+['yes_bid_dollars','yes_ask_dollars','no_bid_dollars','no_ask_dollars'].map(k=>'<td>'+esc(m[k])+'</td>').join('')+'</tr>').join('')}el('q').addEventListener('input',render);fetch('data/latest.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('No data yet');return r.json()}).then(d=>{markets=d.kalshi.markets||[];el('status').textContent='Updated: '+d.updated_utc+' | Kalshi: '+d.kalshi.status+' ('+(d.kalshi.market_count||0)+' scanned'+(d.kalshi.more_pages?', partial':'')+') | BettingPros: '+d.bettingpros.status;render()}).catch(e=>el('status').textContent='Waiting for first workflow run: '+e.message);</script></body></html>
